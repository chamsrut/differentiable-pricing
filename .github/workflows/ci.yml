name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build/ci
          -DDP_BUILD_PYTHON_BINDINGS=OFF
          -DDP_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --parallel
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,data]'
      - name: Lint
        run: ruff check .
      - name: Test
        # PyTorch is deliberately absent from this lightweight job, so every
        # test that imports it lives under python/tests/ml/ and is excluded
        # here by directory. Nothing is silently skipped: the `ml` job below
        # runs that whole directory, and the coverage check in the same job
        # asserts the two sets partition python/tests.
        run: pytest -q --ignore=python/tests/ml
      - name: Every test file is claimed by exactly one CI job
        run: python3 scripts/check_test_partition.py
      - name: Replication protocol is internally consistent
        run: |
          python3 scripts/check_european_replication_protocol.py
          python3 scripts/check_american_neural_pilot_protocol.py
      - name: Versioned result figures are current
        run: |
          python3 scripts/plot_european_validation_results.py --check
          python3 scripts/plot_european_replication_results.py --check
      - name: Frozen American cross-check result is valid and current
        # Deliberately uses only checked-in files. The raw cross-check report
        # is git-ignored and is never present here, so neither check may
        # depend on it.
        run: |
          python3 scripts/freeze_american_lsm_results.py --check
          python3 scripts/plot_american_lsm_results.py --check
      - name: Frozen PDE label-policy v2 result is valid and current
        # The task 9C-C3 terminal snapshot's designated validator. Like the
        # checks above it reads only checked-in files: the raw confirmation
        # report lives under ignored artifacts/ and is never present here.
        # This job runs the CLI once; nothing else in the workflow invokes it.
        run: python3 scripts/freeze_pde_label_policy_v2_results.py --check
      - name: Frozen Task 9G American neural pilot result is valid and current
        # The task 9G snapshot's designated validator, and the offline
        # counterpart of the same check in scripts/check.sh. It reads only the
        # tracked protocol and the tracked snapshot: the raw validation report
        # lives under ignored artifacts/ and is never present here, and no
        # pricing, training, latency measurement, IV inversion or partition
        # access happens. Nothing else in this workflow invokes it.
        run: python3 scripts/freeze_american_neural_pilot_results.py --check
      - name: Task 9H attempt-log checks hold
        # Static and offline: parses tracked Task 9H sources, attempt
        # configurations and the append-only attempt log. It imports nothing
        # from the project package, so it runs in this PyTorch-free job, and it
        # performs no pricing, training or dataset access.
        run: python3 scripts/american_dev_attempts.py check

  ml:
    name: Neural baseline / CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: >
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          'torch>=2.4,<3'
      - name: Install project
        run: python -m pip install -e '.[dev,train]'
      - name: Test neural baseline
        # The whole directory, not an enumerated file list, so a new ML test
        # module is covered by construction.
        run: pytest -q python/tests/ml
