schema_version = "american-neural-pilot-latency/1"
name = "task-9g-american-neural-pilot-latency-v1"
clock = "time.perf_counter_ns"
crr_depths = [256, 512, 1024, 2048, 4096]
crr_operation = "0.5 * (CRR(N) + CRR(N+1))"
neural_end_to_end = "feature construction + standardization + inference + inverse target transform + physical reconstruction"
request_shapes = ["single", "batch8"]
batch_sizes = [1, 8]
thread_budgets = [1, 4]
torch_interop_threads = 1
warmups = 2
repetitions = 7
measurement_order = "deterministic cyclic rotation by repetition"
speedup_statistic = "median of paired CRR-adjacent-average nanoseconds divided by neural end-to-end nanoseconds"
median_confidence_interval = "distribution-free [minimum, maximum] paired-speedup order-statistic interval; actual coverage 0.984375 for n=7"

[request_case_names]
single = ["call_short_negative_rate"]
batch8 = ["call_short_negative_rate", "put_short_high_yield", "call_core", "put_core", "call_long_high_yield", "put_long_high_rate", "call_deep_otm_high_vol", "put_deep_otm_low_vol"]

