# Task 9H attempt: scratch_residual_smooth_floor_v1
#
# IMMUTABLE AFTER USE. Once an attempt has run against this file it is never
# edited: a changed idea gets a new attempt ID and a new file, and
# `python3 scripts/american_dev_attempts.py check` re-verifies that every logged
# attempt's configuration still hashes to the digest that attempt recorded.
#
# E2. Relative to its parent `scratch_residual_architecture_v1` exactly one
# behavioural field changes: the head, `direct` -> `smooth_lower_floor`. The
# initialization seed follows, because the existing rule derives it from the
# attempt ID. The backbone (smooth_residual, width 128, 6 blocks, tanh, no
# normalization, no dropout), the five base features, the representation, the
# regression target, the reconstruction, the selected training rows, the shuffle
# seed, the validation partition, the optimizer, the schedule, the budget, the
# precision, the thread count, the checkpoint semantics and the criterion are
# unchanged.
#
# THE NETWORK STILL PREDICTS THE DIRECT NORMALIZED PRICE. `smooth_lower_floor`
# is an output transformation, not a reparameterization: the network's output is
# the direct head's `raw * price_scale + price_mean`, and the head then projects
# it smoothly onto [floor, inf) with
#     floor  = smooth_max(E_analytic / A, intrinsic / A)
#     output = floor + tau * softplus((direct - floor) / tau)
# It does NOT predict an American premium. E1
# (`scratch_residual_premium_v1`) established that reusing the premium target
# costs the residual backbone its price accuracy — RMSE 0.006852205444033097
# against the direct parent's 0.0021119419277138224 — so the premium target is
# not reused here.
#
# The normalized temperature tau is predeclared in code, not here:
# `american_dev.attempts.SMOOTH_FLOOR_TEMPERATURE = 1e-4`. It lives there because
# every attempt configuration must declare exactly the same top-level keys, so a
# per-attempt temperature field would have to be added to the six immutable
# configurations that already ran. It is pinned in `source_digests` and recorded
# in the attempt report, and `assert_temperature_consistent` re-derives from the
# acceptance file that it sits strictly between the material tolerance (1e-6) and
# the normalized RMSE limit (3e-3).
#
# EXPLORATORY AND VALIDATION-SELECTED. The intrinsic and analytic-European
# bounds are enforced by construction. The stored CRR European comparator may
# still be violated, because it is not the analytic value the head enforces. E2
# addresses bounds, not volatility monotonicity. The predeclared interpretation
# is in `docs/tasks/active/task-9h-american-pricer-development.md`.
schema_version = "american-dev-attempt/1"
attempt_id = "scratch_residual_smooth_floor_v1"
parent_attempt = "scratch_residual_architecture_v1"
hypothesis = "Enforcing the deployment-computable lower floor max(analytic European, intrinsic) as a smooth output transformation removes the intrinsic and analytic-European bound violations while retaining the direct residual model's price accuracy, because the direct normalized-price target is preserved rather than reparameterized."
objective = "price_only"
representation = "american_forward_carry_v1"
target = "u = V / (S * exp(-q * T))"
physical_reconstruction = "V = S * exp(-q * T) * u"
head = "smooth_lower_floor"
conditioning_features = []
dtype = "float64"
device = "cpu"

[architecture]
# Identical to scratch_residual_architecture_v1: no normalization and no
# dropout anywhere, so a row's prediction never depends on batch composition or
# on a random mask.
name = "smooth_residual"
width = 128
blocks = 6
activation = "tanh"

[seeds]
# Paired across candidates where technically meaningful: the shuffle label is
# shared, so every attempt walks the same 32,768 rows in the same order, and
# only the initialization label differs per candidate. The initialization label
# is this attempt's own ID under the existing derivation rule, which is also the
# one confound this composition carries.
initialization_label = "scratch_residual_smooth_floor_v1/init"
shuffle_label = "task-9h/shuffle-v1"
derivation = "first four bytes of SHA-256(label), unsigned big-endian"

[row_selection]
# The same salt and budget in every attempt, so all candidates see exactly the
# same training rows and the comparison is paired by construction. Rule and
# budget carried over from Task 9G.
partition = "train"
row_budget = 32768
salt = "task-9h-train-subset-v1"
rule = "lowest SHA-256(salt + NUL + sample_id), sample_id tie-break"

[training]
batch_size = 2048
epochs = 120
num_threads = 4
deterministic_algorithms = true
shuffle = "torch.randperm from the shuffle seed once per epoch"

[optimizer]
name = "adamw"
learning_rate = 0.001
weight_decay = 0.000001
beta1 = 0.9
beta2 = 0.999
epsilon = 0.00000001
schedule = "cosine_annealing"
minimum_learning_rate = 0.0
schedule_period_epochs = 120

[checkpoint]
selection_partition = "validation"
metric = "standardized_target_mse"
rule = "minimum metric; earliest epoch wins exact ties"

[evaluation]
batch_size = 4096

[paths]
dataset = "data/american-option-v1"
dataset_manifest = "data/american-option-v1/manifest.json"
# The development criterion, reused verbatim. This file is digest-pinned by the
# Task 9G protocol and reconciled in scripts/check.sh and CI, so the criterion
# cannot be quietly loosened after an attempt fails.
acceptance_config = "configs/american_neural_pilot_acceptance_v1.toml"
output_directory = "artifacts/task-9h/scratch_residual_smooth_floor_v1"
ledger = "runs/task-9h/scratch_residual_smooth_floor_v1/attempt.json"
