# CRR label-policy calibration pilot for the American-option dataset, v1.
#
# This file is the PREDECLARATION. The gates below were fixed before the pilot
# was executed and must not be relaxed to fit a result. If no candidate passes,
# the study reports the failure and the further calibration a production label
# policy would need.
#
# Why these thresholds. The surrogate acceptance criteria this project already
# uses are stated as price-over-spot errors:
# `configs/european_neural_acceptance_v1.toml` requires an overall
# price/spot RMSE of at most 5e-4 and a price/spot p99 absolute error of at most
# 2e-3. Reference-pricer numerical error must be materially smaller than the
# acceptance threshold, or the experiment measures label noise
# (docs/research-contract.md). The worst-row gate is therefore set an order of
# magnitude below that RMSE gate, and the p99 gate a further factor of five
# below the worst-row gate.
#
# No number frozen by task 8D is reused here: the LSM cross-check selected no
# label policy and none of its statistics appears below.
#
# The reference is the 8192/8193 adjacent average from the SAME CRR engine. It
# is an internal refinement diagnostic, not independent truth. The independent
# control is the European CRR leg against analytic Black-Scholes.
#
# `batch_threads` affects wall-clock time only. The C++ batch engine is
# documented and tested to be bit-identical across worker counts.

schema_version = "american-crr-label-policy/1"

[study]
name = "american-crr-label-policy-v1"
engine = "dp::crr_binomial/v1"
policy = "american-crr-adjacent-average/1"
# Sampling design the pilot draws from: the production dataset configuration.
dataset_config = "configs/american_option_dataset_v1.toml"
# A stream name of its own, so the pilot covers the identical mixture without
# consuming, perturbing, or overlapping any production partition.
pilot_stream = "label_policy_pilot_v1"
pilot_rows = 2048
step_candidates = [256, 512, 1024, 2048]
reference_steps = 8192
batch_threads = 8

[gates]
# Worst pilot row: |adjacent-average label - high-step reference| / spot.
maximum_absolute_discrepancy_over_spot = 5.0e-5
# 99th percentile of the same quantity.
p99_absolute_discrepancy_over_spot = 1.0e-5
# Independent control: |European CRR adjacent average - Black-Scholes| / spot.
maximum_european_absolute_error_over_spot = 5.0e-5
# Theorem control: an American call on a non-dividend-paying underlying at a
# non-negative rate is never exercised early, so its premium over the European
# price on the same lattice must vanish to floating-point noise.
maximum_non_dividend_call_control_over_spot = 1.0e-12
