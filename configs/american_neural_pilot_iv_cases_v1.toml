schema_version = "american-neural-pilot-iv/1"
name = "task-9g-american-neural-pilot-iv-v1"
terminology = "surface"
price_source = "CRR adjacent average at N=1024 and N+1=1025"
crr_steps = 1024
comparison = "invert label price and each neural price through the same CRR adjacent-average function"
solver = "safeguarded_bisection"
volatility_bracket = [0.05, 0.8]
price_absolute_tolerance_over_spot = 0.0000000001
volatility_absolute_tolerance = 0.00000001
maximum_iterations = 80
failure_rule = "unbracketed root, non-finite price, or iteration exhaustion is a reported failure and is never dropped"

