# Task 9C-B controlled synthetic-label pilot. These choices and thresholds are
# declared before the report under artifacts/ is generated. Stress cases are
# descriptive, remain in every output, and are not part of policy selection.

schema_version = "pde-label-policy-pilot/1"

[study]
name = "pde-label-policy-pilot-v1"
engine = "dp::finite_difference_price/v1"
price_units = "currency_per_share"
greek_method = "centered_price_bumps"
curve_construction = "flat_continuously_compounded_from_case_rate"
selection_order = ["grid_800x400", "grid_1600x800", "richardson_800x400_1600x800"]
anchor_cases = ["regular_euro_atm_call", "stress_american_put_exercise_boundary"]
projected_label_count = 250000
projected_worker_counts = [8, 16]

[solver]
spot_maximum = 400.0
rannacher_steps = 2
psor_tolerance = 1.0e-11
psor_relaxation = 1.2
psor_maximum_iterations = 200000
settlement = "cash"
contract_multiplier = 100.0

[[grids]]
name = "grid_800x400"
spot_intervals = 800
time_steps = 400
role = "candidate"

[[grids]]
name = "grid_1600x800"
spot_intervals = 1600
time_steps = 800
role = "candidate"

[[grids]]
name = "grid_3200x1600"
spot_intervals = 3200
time_steps = 1600
role = "reference"

[[grids]]
name = "grid_6400x3200"
spot_intervals = 6400
time_steps = 3200
role = "anchor"

[bumps]
# Absolute currency-per-share spot bumps and absolute-volatility bumps.
spot = [2.0, 1.0, 0.5]
primary_spot = 1.0
volatility = [0.02, 0.01, 0.005]
primary_volatility = 0.01

[richardson]
coarse_to_fine_ratio = 2
assumed_order = 2.0
minimum_supported_observed_order = 1.5
maximum_supported_observed_order = 2.5

[criteria]
price_absolute_error = 5.0e-4
delta_absolute_error = 1.0e-3
gamma_absolute_error = 2.0e-4
vega_absolute_error_per_unit_volatility = 5.0e-2
# Bump-ladder stability is an additional predeclared pilot requirement. It
# uses the same scales as the accuracy gates and is not loosened after results.
delta_bump_variation = 1.0e-3
gamma_bump_variation = 2.0e-4
vega_bump_variation_per_unit_volatility = 5.0e-2
shape_tolerance = 1.0e-8

# Moneyness is S/K. Every curve begins at (0, 0) and ends at
# (expiry_time, -rate * expiry_time). Dividend times are ACT/365F year
# fractions from the same origin and lie strictly inside the contract life.

