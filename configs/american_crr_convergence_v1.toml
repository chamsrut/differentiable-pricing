# Exploratory numerical study, not a final label-generation acceptance gate.
# The 8,192/8,193 adjacent average is a high-step internal CRR reference, not
# independent truth. The study must be interpreted together with its analytic
# European controls and later LSM cross-checks.

schema_version = "american-crr-convergence/1"

[study]
name = "american-crr-convergence-v1"
engine = "dp::crr_binomial/v1"
exercise_style = "american"
step_ladder = [64, 128, 256, 512, 1024, 2048, 4096]
reference_steps = 8192
diagnostic_step_ladder = [256, 512, 1024, 2048]
batch_threads = 4

[[cases]]
name = "standard_atm_put"
option_type = "put"
spot = 100.0
strike = 100.0
maturity = 1.0
rate = 0.05
dividend_yield = 0.0
volatility = 0.20
exercise_expectation = "material"

