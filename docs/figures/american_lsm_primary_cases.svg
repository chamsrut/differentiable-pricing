<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img">
<title>American LSM primary case results</title>
<style>text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
<rect width="1180" height="740" rx="18" fill="#ffffff"/>
<text x="36.0" y="44.0" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Primary experiment case results (paths-high-primary-v1)</text>
<text x="36.0" y="72.0" font-size="14" font-weight="400" text-anchor="start" fill="#536078">CRR - LSM per case, with a +/- 1 valuation-only standard error bar. Positive means LSM sits below the</text>
<text x="36.0" y="92.0" font-size="14" font-weight="400" text-anchor="start" fill="#536078">CRR reference, which is the expected ordering for a fixed learned stopping policy on a coarser grid.</text>
<text x="36.0" y="120.0" font-size="13" font-weight="400" text-anchor="start" fill="#b42318">The bar covers valuation sampling noise only. Policy-fitting error and exercise-grid bias are NOT included,</text>
<text x="36.0" y="139.0" font-size="13" font-weight="400" text-anchor="start" fill="#b42318">so a bar excluding zero is not evidence of a defect and is not an acceptance gate.</text>
