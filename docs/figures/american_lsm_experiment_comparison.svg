<text x="36.0" y="72.0" font-size="14" font-weight="400" text-anchor="start" fill="#536078">Price units, log scale. CRR - LSM is the gap to the 8,192-step CRR adjacent-average reference.</text>
<text x="36.0" y="94.0" font-size="13" font-weight="400" text-anchor="start" fill="#b42318">The standard error is valuation sampling noise only. It is NOT a total-error bar: it excludes policy-fitting</text>
<text x="36.0" y="113.0" font-size="13" font-weight="400" text-anchor="start" fill="#b42318">error and discrete-exercise (grid) bias, which are systematic and do not shrink with more valuation paths.</text>
