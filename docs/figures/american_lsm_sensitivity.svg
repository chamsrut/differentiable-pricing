<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img">
<title>American LSM sensitivity</title>
<style>text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
<rect width="1180" height="560" rx="18" fill="#ffffff"/>
<text x="36.0" y="44.0" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Path, exercise-grid and basis sensitivity</text>
<text x="36.0" y="72.0" font-size="14" font-weight="400" text-anchor="start" fill="#536078">Each panel varies one factor. Bars are the experiment mean CRR - LSM gap (log scale); the amber marker is</text>
<text x="36.0" y="92.0" font-size="14" font-weight="400" text-anchor="start" fill="#536078">the mean valuation-only standard error, which measures sampling noise alone and not total error.</text>
<text x="72.0" y="138.0" font-size="15" font-weight="700" text-anchor="start" fill="#172033">Basis degree</text>
<text x="72.0" y="156.0" font-size="11" font-weight="400" text-anchor="start" fill="#536078">at 64 steps, 32,768 training paths</text>
<line x1="72.0" y1="422.0" x2="404.0" y2="422.0" stroke="#dce2ea" stroke-width="1.0"/>
<text x="64.0" y="426.0" font-size="11" font-weight="400" text-anchor="end" fill="#657189">0.01</text>
<line x1="72.0" y1="297.0" x2="404.0" y2="297.0" stroke="#dce2ea" stroke-width="1.0"/>
<text x="64.0" y="301.0" font-size="11" font-weight="400" text-anchor="end" fill="#657189">0.1</text>
<line x1="72.0" y1="172.0" x2="404.0" y2="172.0" stroke="#dce2ea" stroke-width="1.0"/>
<text x="64.0" y="176.0" font-size="11" font-weight="400" text-anchor="end" fill="#657189">1</text>
<line x1="72.0" y1="422.0" x2="404.0" y2="422.0" stroke="#9aa4b8" stroke-width="1.0"/>
<rect x="101.9" y="199.4" width="50.9" height="222.6" rx="2.0" fill="#2563eb"/>
<text x="127.3" y="191.4" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.6042</text>
<line x1="98.9" y1="389.2" x2="155.8" y2="389.2" stroke="#d97706" stroke-width="2.5"/>
<text x="127.3" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">degree 1</text>
<rect x="212.5" y="367.8" width="50.9" height="54.2" rx="2.0" fill="#2563eb"/>
<text x="238.0" y="359.8" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0271</text>
<line x1="209.5" y1="390.1" x2="266.5" y2="390.1" stroke="#d97706" stroke-width="2.5"/>
<text x="238.0" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">degree 2</text>
<rect x="323.2" y="365.6" width="50.9" height="56.4" rx="2.0" fill="#2563eb"/>
<text x="348.7" y="357.6" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0283</text>
<line x1="320.2" y1="390.8" x2="377.1" y2="390.8" stroke="#d97706" stroke-width="2.5"/>
<text x="348.7" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">degree 3</text>
<text x="72.0" y="484.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">Degree one is inadequate; quadratic and</text>
<text x="72.0" y="500.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">cubic are comparable.</text>
<text x="448.0" y="138.0" font-size="15" font-weight="700" text-anchor="start" fill="#172033">Exercise dates</text>
<text x="448.0" y="156.0" font-size="11" font-weight="400" text-anchor="start" fill="#536078">at degree 2, 32,768 training paths</text>
<line x1="448.0" y1="422.0" x2="780.0" y2="422.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="448.0" y1="297.0" x2="780.0" y2="297.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="448.0" y1="172.0" x2="780.0" y2="172.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="448.0" y1="422.0" x2="780.0" y2="422.0" stroke="#9aa4b8" stroke-width="1.0"/>
<rect x="477.9" y="365.9" width="50.9" height="56.1" rx="2.0" fill="#2563eb"/>
<text x="503.3" y="357.9" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0281</text>
<line x1="474.9" y1="390.7" x2="531.8" y2="390.7" stroke="#d97706" stroke-width="2.5"/>
<text x="503.3" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">32 steps</text>
<rect x="588.5" y="367.8" width="50.9" height="54.2" rx="2.0" fill="#2563eb"/>
<text x="614.0" y="359.8" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0271</text>
<line x1="585.5" y1="390.1" x2="642.5" y2="390.1" stroke="#d97706" stroke-width="2.5"/>
<text x="614.0" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">64 steps</text>
<rect x="699.2" y="357.2" width="50.9" height="64.8" rx="2.0" fill="#2563eb"/>
<text x="724.7" y="349.2" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0330</text>
<line x1="696.2" y1="390.6" x2="753.1" y2="390.6" stroke="#d97706" stroke-width="2.5"/>
<text x="724.7" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">128 steps</text>
<text x="448.0" y="484.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">More exercise dates at fixed training paths</text>
<text x="448.0" y="500.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">did not improve the gap.</text>
<text x="824.0" y="138.0" font-size="15" font-weight="700" text-anchor="start" fill="#172033">Path budget</text>
<text x="824.0" y="156.0" font-size="11" font-weight="400" text-anchor="start" fill="#536078">at degree 2, 64 steps</text>
<line x1="824.0" y1="422.0" x2="1156.0" y2="422.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="824.0" y1="297.0" x2="1156.0" y2="297.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="824.0" y1="172.0" x2="1156.0" y2="172.0" stroke="#dce2ea" stroke-width="1.0"/>
<line x1="824.0" y1="422.0" x2="1156.0" y2="422.0" stroke="#9aa4b8" stroke-width="1.0"/>
<rect x="853.9" y="372.0" width="50.9" height="50.0" rx="2.0" fill="#2563eb"/>
<text x="879.3" y="364.0" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0251</text>
<line x1="850.9" y1="372.1" x2="907.8" y2="372.1" stroke="#d97706" stroke-width="2.5"/>
<text x="879.3" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">16,384 train</text>
<rect x="964.5" y="367.8" width="50.9" height="54.2" rx="2.0" fill="#2563eb"/>
<text x="990.0" y="359.8" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0271</text>
<line x1="961.5" y1="390.1" x2="1018.5" y2="390.1" stroke="#d97706" stroke-width="2.5"/>
<text x="990.0" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">32,768 train</text>
<rect x="1075.2" y="374.9" width="50.9" height="47.1" rx="2.0" fill="#1d4ed8"/>
<text x="1100.7" y="366.9" font-size="10" font-weight="400" text-anchor="middle" fill="#354158">0.0238</text>
<line x1="1072.2" y1="409.3" x2="1129.1" y2="409.3" stroke="#d97706" stroke-width="2.5"/>
<text x="1100.7" y="440.0" font-size="11" font-weight="400" text-anchor="middle" fill="#172033">65,536 train</text>
<text x="1100.7" y="455.0" font-size="9" font-weight="400" text-anchor="middle" fill="#536078">(primary)</text>
<text x="824.0" y="484.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">More paths cut valuation noise; the mean gap</text>
<text x="824.0" y="500.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">improved only modestly.</text>
<rect x="72.0" y="526.0" width="22.0" height="9.0" rx="4.0" fill="#2563eb"/>
<text x="102.0" y="534.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">Mean CRR - LSM gap (log scale)</text>
<line x1="430.0" y1="530.0" x2="452.0" y2="530.0" stroke="#d97706" stroke-width="3.0"/>
<text x="460.0" y="534.0" font-size="11" font-weight="400" text-anchor="start" fill="#354158">Mean valuation-only standard error</text>
</svg>
