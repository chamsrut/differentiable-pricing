<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img">
<title>Validation error progression</title>
<style>text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
<rect width="1000" height="570" rx="18" fill="#ffffff"/>
